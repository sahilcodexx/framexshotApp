[package]
name = "framexshot"
version = "1.1.0"
description = "FrameXShot — screenshot tool with a beautiful editor"
authors = ["Sahil Singh"]
edition = "2021"

[lib]
name = "framexshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "5"
image = "0.25"
imageproc = "0.25"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
xcap = { version = "0.8", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"
# Native folder picker for `select_folder_dialog` — zenity/kdialog are Linux-only.
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus capture fallbacks: xdg-desktop-portal Screenshot + GNOME Shell
# SelectArea/ScreenshotArea. Pure Rust — already in the tree via xcap.
zbus = "5"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# `wgc` switches xcap's Windows backend from the GDI path (BitBlt off the screen
# DC) to Windows.Graphics.Capture. The GDI path cannot read hardware-overlay /
# flip-model surfaces, so GPU-composited windows — browsers, Electron apps,
# video players, games — came back as a fully black image. WGC reads the
# composition surface and captures them correctly.
#
# Cost: WGC needs Windows 10 1903 (build 18362) or newer, and on Windows 10 it
# draws a yellow border around the captured surface while capturing. Windows 11
# and `xcap` >= 0.8 suppress the border where the OS allows it. Cargo unifies
# features across dependency tables, so this adds `wgc` on top of the base
# `xcap` entry above rather than replacing it.
xcap = { version = "0.8", default-features = false, features = ["wgc"] }
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
    "windef",
    "winsock2",
    "processthreadsapi",
    "handleapi",
    "shellapi",
    "commctrl",
    "consoleapi",
    "fileapi",
] }

[profile.dev]
opt-level = 0
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

