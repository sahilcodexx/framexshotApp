[package]
name = "framexshot"
version = "1.1.0"
description = "FrameXShot — Linux screenshot tool"
authors = ["Sahil Singh"]
edition = "2021"

[lib]
name = "framexshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "5"
image = "0.25"
imageproc = "0.25"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
xcap = { version = "0.8", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus capture fallbacks: xdg-desktop-portal Screenshot + GNOME Shell
# SelectArea/ScreenshotArea. Pure Rust — already in the tree via xcap.
zbus = "5"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
    "windef",
    "winsock2",
    "processthreadsapi",
    "handleapi",
    "shellapi",
    "commctrl",
    "consoleapi",
    "fileapi",
] }

[profile.dev]
opt-level = 0
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

